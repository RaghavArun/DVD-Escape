<!DOCTYPE html>
<html>
<head>
    <title>DVD Animation</title>
</head>

<body>

<canvas id="canvas" width="1200" height="720"></canvas>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script src="js/dvd.js"></script>
<script src="js/collisions.js"></script>
<script src="js/fireball.js"></script>
<script src="js/confetti.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// CHANGE COLORS

function changeColors() {

    // 50% chance of getting a dark background
    const darkBackground = Math.random() < 0.5;


    if (darkBackground) {

        // pick random dark background
        backgroundColor =
            darkBackgrounds[
                Math.floor(
                    Math.random() * darkBackgrounds.length
                )
            ];


        // pick random light DVD color
        dvdColor =
            lightDVDColors[
                Math.floor(
                    Math.random() * lightDVDColors.length
                )
            ];

    } else {

        // pick random light background
        backgroundColor =
            lightBackgrounds[
                Math.floor(
                    Math.random() * lightBackgrounds.length
                )
            ];


        // pick random dark DVD color
        dvdColor =
            darkDVDColors[
                Math.floor(
                    Math.random() * darkDVDColors.length
                )
            ];
    }
}

// DRAW EVERYTHING

function draw() {

    ctx.fillStyle = backgroundColor;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWalls();
    drawTrail();
    drawFireballTrail();
    drawDVD();
    drawFireball();

    // uncomment for hitbox debug
    // drawCollisionBox();
    drawUI();
}


// ANIMATION LOOP

let previousTime = 0;
let accumulatedTime = 0;

function animate(currentTime) {
    if (previousTime === 0) {
        previousTime = currentTime;
        lastRenderTime = currentTime;
    }

    const elapsedTime = currentTime - previousTime;
    previousTime = currentTime;

    accumulatedTime += elapsedTime;

    // fixed-time simulation updates
    while (accumulatedTime >= timestep) {
        if (gameState === "playing") {
            updateDVD();
            updateFireball();
            updateFadingWalls();
        }

        updateConfetti();

        accumulatedTime -= timestep;
    }

    // variable-rate rendering with optional FPS cap (user selected)
    const renderInterval = maxFPS > 0 ? 1000 / maxFPS : 0;

    if (maxFPS === 0 || currentTime - lastRenderTime >= renderInterval) {
        draw();
        drawConfetti();

        lastRenderTime = currentTime;
    }

    requestAnimationFrame(animate);
}

// START

requestAnimationFrame(animate);

// RESTART

function restartGame() {
    gameState = "playing";
    hits = 0;
    hitCooldown = 0;

    dvdX = originalX;
    dvdY = originalY;

    dvdSpeedX = 2.4;
    dvdSpeedY = 1.6;

    fireballX = 700;
    fireballY = 400;

    fireballSpeedX = 6;
    fireballSpeedY = 5;

    walls = [];
    fadingWalls = [];
    dvdTrail = [];
    fireballTrail = [];
    confetti = [];
}

</script>

</body>
</html>
